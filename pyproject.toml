[project]
name = "captor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.24.0",
    "monai>=1.6.0",
    "nibabel>=5.4.2",
    "nltk>=3.10.0",
    "numpy>=2.5.1",
    "safetensors>=0.8.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "totalsegmentator>=2.16.0",
    "tqdm>=4.69.0",
    "transformers>=5.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captor"]
